<!doctype html><meta charset="utf-8">
<style>
 body{margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;}
 .wrap{display:flex;flex-direction:column;}
 .bar{display:flex;align-items:center;gap:8px;padding:6px 10px;}
 .av{width:34px;height:34px;border-radius:50%;}
 .cap img{height:18px;margin-right:-6px;}
 #board{position:relative;}
 .cg-wrap{width:100%;height:100%;position:relative;}
 .moves{padding:10px;font-size:14px;} .btns{display:flex;justify-content:space-around;padding:12px;}
 .btns div{width:44px;height:44px;border-radius:8px;background:#888;opacity:.5}

 .cg-wrap square.check{background:radial-gradient(ellipse at center,rgba(255,0,0,1) 0%,rgba(231,0,0,1) 25%,rgba(169,0,0,0) 89%,rgba(158,0,0,0) 100%)}

</style>
<link rel="stylesheet" href="/node_modules/chessground/assets/chessground.base.css">
<link rel="stylesheet" href="/node_modules/chessground/assets/chessground.cburnett.css" id="x">
<style id="pieces"></style><style id="boardbg"></style>
<div class="wrap" id="wrap"></div>
<script type="module">
import {Chessground} from '/node_modules/chessground/dist/chessground.js';
window.render = (cfg)=>{
  const W=cfg.width, wrap=document.getElementById('wrap');
  document.body.style.background=cfg.bg; document.body.style.color=cfg.fg;
  document.getElementById('x').remove();
  const sides=['w','b'], names={p:'pawn',n:'knight',b:'bishop',r:'rook',q:'queen',k:'king'};
  let css='';
  for(const c of 'wb')for(const k of 'pnbrqk')
    css+=`.cg-wrap piece.${c==='w'?'white':'black'}.${names[k]}{background-image:url(/pieces/${cfg.set}/${c}${k.toUpperCase()}.svg);background-size:cover}\n`;
  document.getElementById('pieces').textContent=css;
  // damier : deux couleurs, 8x8 en SVG
  const s=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect width='8' height='8' fill='${cfg.dark}'/>`+
   [...Array(32)].map((_,i)=>{const r=Math.floor(i/4),c=(i%4)*2+(r%2);return `<rect x='${c}' y='${r}' width='1' height='1' fill='${cfg.light}'/>`}).join('')+`</svg>`;
  const st=cfg.style, dr=Math.round(st.dotr*100*2.5);
  document.getElementById('boardbg').textContent=`.cg-wrap square.last-move{background-color:${st.hl}}
   .cg-wrap square.selected{background-color:${st.sel}}
   .cg-wrap square.move-dest{background:radial-gradient(${st.dot} ${dr}%,rgba(0,0,0,0) ${dr+1}%)}
   .cg-wrap square.oc.move-dest{background:radial-gradient(transparent 0%,transparent 79%,${st.dot} 80%)}
   cg-board{background-image:url("data:image/svg+xml;base64,${btoa(s)}");background-size:cover}
   .cg-wrap coords{color:${cfg.coordColor}} `;
  const mkbar=(who,caps)=>`<div class="bar"><div class="av" style="background:${cfg.avatar}"></div><b>${who}</b><span style="opacity:.6">${cfg.rating}</span><span class="cap">${caps.map(p=>`<img src="/pieces/${cfg.capSet}/${p}.svg">`).join('')}</span></div>`;
  wrap.innerHTML=(cfg.chrome?mkbar('Opp',cfg.capTop):'')+`<div id="board" style="width:${W}px;height:${W}px"></div>`+(cfg.chrome?mkbar('You',cfg.capBot)+`<div class="moves">1. e4 c5 2. Nf3 d6 3. d4 cxd4 4. Nxd4 Nf6</div><div class="btns"><div></div><div></div><div></div><div></div></div>`:'');
  const el=document.getElementById('board');
  window.cg=Chessground(el,{fen:cfg.fen,orientation:cfg.orientation,coordinates:cfg.coords,coordinatesOnSquares:cfg.coordsOnSquares||false,
    lastMove:cfg.lastMove,check:cfg.check,animation:{enabled:false},viewOnly:false,
    movable:{free:false,color:cfg.sel?'both':undefined,dests:cfg.dests?new Map([[cfg.sel,cfg.dests]]):new Map(),showDests:true},
    highlight:{lastMove:true,check:true},
    selected:cfg.sel||undefined,
    drawable:{enabled:true,shapes:cfg.shapes||[]}});
  const r=el.getBoundingClientRect();return [r.x,r.y,r.width,r.height];
};
window.ready=true;
</script>
