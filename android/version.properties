# Le numéro que prendra la PROCHAINE construction de release.
#
# Google consomme un versionCode dès qu'un fichier est déposé, et le consomme
# même si l'envoi est REFUSÉ. Réutiliser un numéro est donc impossible, et
# l'oublier coûte un aller-retour : construire, se faire refuser, recompiler.
#
# Ce fichier est incrémenté automatiquement après chaque `assembleRelease` ou
# `bundleRelease` (voir `bumpVersionCode` dans app/build.gradle.kts). Il est
# VERSIONNÉ : l'historique dit quel numéro est parti chez Google, et quand.
versionCode=18
